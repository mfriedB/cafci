<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informe de Gestión FCI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&family=Open+Sans:wght@400;600;700&family=Inter:wght@300;400;600;700;800&display=swap">
<style>
:root{
  /* Réplica del Power BI "Informe de Gestión FCI": banda Balanz arriba, segmentadores a la izquierda/arriba, visuales con título en banda azul */
  --navy:#13306a; --navy-2:#1d2a6b; --band:#173f7f; --blue:#3e8bd8; --blue-2:#1f6fe0; --sky:#9cc6f2;
  --ink:#1b2333; --muted:#6a7487; --line:#d9dfea; --panel:#ffffff; --bg:#eef1f6; --ok:#13a454; --bad:#d23b3b; --warn:#e9b10a;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --f-cond:"Barlow Condensed","Barlow",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,#141a52 0%,#1e2470 45%,#30287f 100%);color:#fff;
  display:flex;align-items:center;gap:18px;padding:10px 18px;min-height:56px;overflow:hidden}
.top::after{content:"";position:absolute;right:-40px;top:-30px;width:460px;height:140px;opacity:.35;pointer-events:none;
  background:linear-gradient(135deg,transparent 48%,#8f9ad8 49%,transparent 50%),linear-gradient(45deg,transparent 48%,#8f9ad8 49%,transparent 50%);
  background-size:120px 120px}
.brand{font:700 26px/1 var(--f-body);letter-spacing:.5px}
.brand small{display:block;font:500 12px var(--f-body);opacity:.8;letter-spacing:0;margin-top:3px}
.meta{margin-left:auto;font-size:12px;opacity:.85;text-align:right;position:relative;z-index:1}
nav.groups{display:flex;flex-wrap:wrap;gap:6px;padding:10px 18px 0;background:var(--bg)}
nav.groups button{font:600 13px var(--f-body);border:1px solid var(--line);background:#fff;color:var(--navy);padding:7px 12px;border-radius:4px;cursor:pointer}
nav.groups button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
nav.pages{display:flex;flex-wrap:wrap;gap:4px;padding:8px 18px;border-bottom:1px solid var(--line);background:var(--bg)}
nav.pages button{font:500 12.5px var(--f-body);border:0;background:transparent;color:var(--muted);padding:5px 9px;border-radius:3px;cursor:pointer}
nav.pages button[aria-pressed="true"]{background:#dfe6f3;color:var(--navy);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue-2);outline-offset:1px}
main{padding:14px 18px 40px}
.page{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;align-items:start}
.page.full{grid-template-columns:minmax(0,1fr)}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:76px}
.content{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.row.r2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.row.r1{grid-template-columns:minmax(0,1fr)}
.vis{background:var(--panel);border:1px solid #c9d3e6;min-width:0;display:flex;flex-direction:column}
.vis>h3{margin:0;background:var(--band);color:#fff;font:500 14px/1.2 var(--f-body);text-align:center;padding:6px 10px;text-wrap:balance}
.vis>.b{padding:8px;flex:1;min-width:0}
.chart{width:100%;height:320px}
.chart.tall{height:440px}.chart.xtall{height:560px}.chart.short{height:240px}
.slicer{background:#fff;border:1px solid #c9d3e6}
.slicer>h4{margin:0;background:var(--band);color:#fff;font:600 12.5px var(--f-body);padding:5px 8px}
.slicer .opts{max-height:260px;overflow:auto;padding:4px 6px}
.slicer label{display:flex;gap:6px;align-items:center;font-size:12.5px;padding:2px 0;cursor:pointer}
.slicer input[type=search]{width:calc(100% - 12px);margin:6px;padding:5px 7px;border:1px solid var(--line);font:inherit;font-size:12.5px}
.slicer .acts{display:flex;gap:8px;padding:4px 8px 6px;font-size:11.5px}
.slicer .acts button{border:0;background:none;color:var(--blue-2);cursor:pointer;padding:0;font:inherit}
.btnbar{display:flex;flex-wrap:wrap;gap:0;background:var(--navy);padding:4px;border-radius:2px}
.btnbar button{flex:1 1 110px;font:500 12.5px var(--f-body);border:1px solid #2a3c7c;background:#fff;color:var(--ink);padding:7px 6px;cursor:pointer;margin:1px}
.btnbar button[aria-pressed="true"]{background:#0c1430;color:#fff}
.cards{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));padding:4px}
.kpi{border:1px solid var(--line);padding:8px 6px;text-align:center}
.kpi .v{font:600 22px/1.15 var(--f-body);font-variant-numeric:tabular-nums}
.kpi .v.big{font-size:30px}
.kpi .l{font-size:11.5px;color:var(--muted);margin-top:3px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.t th{background:var(--navy);color:#fff;font-weight:600;padding:5px 7px;text-align:right;position:sticky;top:0;cursor:pointer;white-space:nowrap}
table.t th.l,table.t td.l{text-align:left}
table.t td{padding:4px 7px;text-align:right;border-bottom:1px solid #edf0f6;white-space:nowrap}
table.t tr:nth-child(even) td{background:#f5f8fd}
table.t tr.tot td{font-weight:700;border-top:2px solid var(--navy);background:#fff}
table.t tr.hl td{background:#dbe8fb;font-weight:600}
.tw{overflow:auto;max-height:560px}
.note{font-size:12px;color:var(--muted);margin:2px 2px 0}
.empty{padding:30px;text-align:center;color:var(--muted)}
.load{padding:60px;text-align:center;color:var(--muted);font-size:15px}
.sm{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.sm .cell{border:1px solid var(--line);background:#fff}
.sm .cell h5{margin:0;padding:5px 8px;font:600 13px var(--f-body);color:var(--navy)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:0 4px 4px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
@media (max-width:760px){.page{grid-template-columns:minmax(0,1fr)}.side{position:static;flex-direction:row;flex-wrap:wrap}.side>*{flex:1 1 180px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Aviso de fondos a clasificar */
.alerta{display:flex;align-items:center;gap:12px;background:#fff6d6;border:1px solid var(--warn);border-left:6px solid var(--warn);border-radius:6px;padding:10px 14px;margin:0 0 12px;color:var(--ink);font-size:14px}
.alerta b{font-weight:700}
.alerta button{margin-left:auto;background:var(--navy);color:#fff;border:0;border-radius:4px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.ovl{position:fixed;inset:0;background:rgba(15,25,50,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.pop{background:#fff;border-radius:8px;max-width:820px;width:100%;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.pop h2{margin:0;padding:14px 18px;background:var(--band);color:#fff;font:600 18px var(--f-cond);border-radius:8px 8px 0 0}
.pop .bd{padding:14px 18px;overflow:auto;font-size:13px;color:var(--ink)}
.pop .bd p{margin:0 0 10px}
.pop table{width:100%;border-collapse:collapse;font-size:12.5px}
.pop th{text-align:left;background:var(--bg);padding:6px;border-bottom:1px solid var(--line)}
.pop td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.pop td.n{text-align:right;white-space:nowrap}
.pop .tag{display:inline-block;background:var(--warn);color:#1b2333;border-radius:3px;padding:0 5px;font-size:11px;font-weight:700;margin-left:4px}
.pop .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
.pop .ft button{background:var(--navy);color:#fff;border:0;border-radius:4px;padding:8px 16px;font:inherit;cursor:pointer}
code{background:var(--bg);padding:0 4px;border-radius:3px}
/* Visuales "slide" de la Call (panel de 1320 px como el recuadro de la slide, para screenshot) */
.sl-wrap{overflow-x:auto;padding:4px 0}
.sl-panel{width:1320px;background:#fff;border:1.5px solid #293486;font-family:"Open Sans",Arial,sans-serif;color:#07204F}
.sl-band{background:#293486;color:#fff;text-align:center;font-weight:700;font-size:21px;padding:10px 12px}
.sl-body{padding:22px 20px 20px}
.sl-tiles{display:grid;gap:12px}
.sl-col{text-align:center}
.sl-mes{font-weight:700;font-size:17px;margin-bottom:12px}
.sl-tile{background:#293486;color:#fff;font-weight:700;font-size:52px;line-height:1;height:190px;display:flex;align-items:center;justify-content:center}
.sl-tile.alt{background:#6281D4}
.sl-val{font-weight:700;font-size:15px;margin-top:14px;white-space:nowrap}
.sl-sub{font-size:12px;color:#6B6F7B;margin-top:6px;white-space:nowrap}
.sl-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:40px}
.sl-kpi{background:#F1F3FA;display:flex;align-items:center;gap:18px;padding:16px 18px;min-height:115px}
.sl-big{font-weight:700;font-size:38px;color:#293486;white-space:nowrap;flex:0 0 auto;min-width:150px}
.sl-txt{font-size:16px;line-height:1.3;color:#07204F}
.sl-row2{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:36px;align-items:stretch}
.sl-chartbox{display:flex;flex-direction:column}
.sl-chart{width:100%;height:410px}
.sl-ley{display:flex;gap:120px;font-size:14px;color:#6B6F7B;padding:0 0 0 30px}
.sl-ley i{display:inline-block;width:15px;height:15px;margin-right:8px;vertical-align:-2px}
.sl-ley i.sq{background:#C5CEEA}.sl-ley i.dot{background:#6A3DE8;border-radius:50%}
.sl-kcol{display:flex;flex-direction:column;gap:20px}
.sl-kcol .sl-kpi{min-height:122px}
.sl-kcol .sl-big{min-width:130px}
.sl-nota{font-style:italic;font-size:13px;color:#07204F;margin:4px 2px 0;width:1320px;max-width:100%}


/* Call de Fondos: slides 3-10 (lienzo 16:9) */
.cs-wrap{overflow-x:auto;padding:4px 0}
.cs-slide{width:1280px;height:720px;background:#fff;position:relative;border:1px solid #e3e6ee;font-family:Inter,"Open Sans",Arial,sans-serif;color:#0B1F5C;box-sizing:border-box;overflow:hidden}
.cs-title{position:absolute;left:34px;top:20px;font-size:44px;font-weight:400;letter-spacing:-.3px}
.cs-title.con-pill{top:62px;font-size:52px}
.cs-ytd{font-size:26px;margin-left:12px}
.cs-pill{position:absolute;left:66px;top:20px;background:#4AA4E2;color:#fff;font-size:15px;padding:6px 14px;border-radius:12px}
.cs-body{position:absolute;left:30px;right:30px;top:100px;bottom:62px}
.cs-nota{position:absolute;left:24px;bottom:12px;font-size:11px;font-style:italic;color:#0B1F5C}
.cs-logo{position:absolute;right:42px;bottom:16px;font-family:Inter,Arial,sans-serif;font-weight:800;font-size:28px;letter-spacing:.5px;color:#07153A}
.cs-box{border:1.5px solid #293486;background:#fff}
.cs-band{background:#293486;color:#fff;font-family:Barlow,"Open Sans",Arial,sans-serif;font-weight:600;font-size:15px;text-align:center;padding:4px 8px}
.cs-boxbody{padding:4px 6px}
.cs-chart{width:100%}
.cs-ley{display:flex;gap:16px;font-size:11px;color:#6B6F7B;padding:6px 6px 0}
.cs-ley i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.cs-dos{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;padding-top:30px}
.cs-snap{display:grid;grid-template-columns:400px 300px 1fr;gap:26px;top:86px}
.cs-aba{font-size:26px;font-weight:700;text-align:center;padding:8px 0 10px;border:2px solid #293486;margin:6px 4px}
.cs-nums{display:grid;grid-template-columns:repeat(3,1fr);row-gap:50px;column-gap:30px;padding:70px 20px 0}
.cs-numv{font-size:52px;font-weight:700;color:#0A6FC2;line-height:1.05}
.cs-numt{font-size:15px;font-weight:700;color:#7A7A7A;text-transform:uppercase;margin-top:12px;max-width:300px;line-height:1.3}
.cs-top{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;padding:14px 14px 18px;align-items:end}
.cs-topc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:250px}
.cs-topv{font-family:Barlow,Arial,sans-serif;font-weight:700;font-size:13px;color:#555;margin-bottom:6px;white-space:nowrap}
.cs-topb{width:72px;background:#293486}
.cs-topn{font-family:Barlow,Arial,sans-serif;font-weight:700;font-size:13px;text-align:center;margin-top:12px;min-height:48px;line-height:1.25;padding:2px 3px;color:#111}
.cs-topn.bz{background:#FFF9C4}
.cs-topflecha{position:absolute;font-weight:800;font-size:17px;color:#0B1F5C;white-space:nowrap}
.cs-plain{border:1px solid #e3e6ee;padding:4px}
</style>
</head>
<body>
<header class="top">
  <div class="brand">BALANZ<small>Informe de Gestión FCI</small></div>
  <div class="meta" id="meta">Cargando datos…</div>
</header>
<nav class="groups" id="groups" aria-label="Secciones"></nav>
<nav class="pages" id="pages" aria-label="Páginas"></nav>
<main id="main"><div class="load">Cargando la base CAFCI/CNV…</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.1/echarts.min.js"></script>
<script src="model.js"></script>
<script src="ui.js"></script>
<script src="pages_aum.js"></script>
<script src="pages_flujo.js"></script>
<script src="pages_call.js"></script>
<script src="pages_call_prop.js"></script>
<script src="pages_call_slides.js"></script>
<script src="pages_internos.js"></script>
<script src="app.js"></script>
</body>
</html>
