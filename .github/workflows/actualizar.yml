# Base de fondos CAFCI/CNV: descarga las planillas diarias oficiales, el dolar MEP y los informes de CAFCI,
# procesa todo al formato de la base de 1816 y publica los resultados en la rama `datos` (procesado/ e informes/).
# La rama datos tiene un solo commit que se reemplaza en cada corrida: el historial no crece con los datos.
# main guarda solo codigo.
name: Actualizar base CAFCI-CNV

on:
  schedule:
    - cron: '47 15 * * 1-5'     # 12:47 hora Argentina, lunes a viernes
    - cron: '47 21 * * 1-5'     # 18:47 hora Argentina (la CNV suele publicar la planilla del dia anterior al mediodia)
  push:
    branches: [main]
    paths: ['scripts/**', 'mapeo/**', 'config.json', '.github/workflows/actualizar.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-base
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: Traer los datos publicados (rama datos)
        run: |
          if git clone -q --depth 1 --branch datos --single-branch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" _datos; then
            for d in procesado informes; do rm -rf "$d"; [ -d "_datos/$d" ] && mv "_datos/$d" "$d"; done
          else
            echo "No existe la rama datos: se arma desde cero"; mkdir -p _datos
          fi
          mkdir -p procesado informes
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests openpyxl pandas pyarrow
      - name: Recuperar planillas originales (cache)
        uses: actions/cache/restore@v4
        with:
          path: raw
          key: planillas-${{ github.run_id }}
          restore-keys: planillas-
      - name: Descargar planillas CNV
        continue-on-error: true   # un corte puntual de la CNV no frena el resto; sigue en la proxima corrida
        run: timeout 7200 python -u scripts/descargar_cnv.py
      - name: Informes mensuales CAFCI (cuotapartistas)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          python -u scripts/bajar_informes.py
      - name: Dolar MEP y BCRA A3500
        continue-on-error: true
        run: python -u scripts/dolar.py
      - name: Leer planillas nuevas (cache de lectura)
        run: python -u scripts/procesar.py --solo-leer
      - name: Guardar planillas y lecturas (cache)
        uses: actions/cache/save@v4
        with:
          path: raw
          key: planillas-${{ github.run_id }}-leidas
      - name: Procesar (formato 1816)
        run: python -u scripts/procesar.py
      - name: Rendimientos (ranking como 1816)
        run: python -u scripts/rendimientos.py
      - name: Tablero Ranking Fondos Balanz
        run: python -u scripts/dashboard_balanz.py
      - name: Informe de Gestion (industria ARS y USD)
        run: python -u scripts/informe_gestion.py
      - name: Cuotapartistas (serie CAFCI y estimacion por fondo)
        continue-on-error: true
        run: python -u scripts/cuotapartistas.py
      - name: Insights (alertas, liquidez, estacionalidad, fees, cambios) y serie diaria por fondo
        continue-on-error: true
        run: python -u scripts/insights.py
      - name: Series de valor de cuotaparte por clase (API /api/vcp)
        continue-on-error: true
        run: python -u scripts/series_vcp.py
      - name: Parquet (consultas SQL por HTTP)
        run: python -u scripts/parquet.py
      - name: Guardar planillas originales (cache)
        if: failure()
        uses: actions/cache/save@v4
        with:
          path: raw
          key: planillas-${{ github.run_id }}
      - name: Publicar resultados (rama datos, un solo commit)
        run: |
          cd _datos
          [ -d .git ] || { git init -q; git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"; }
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf procesado informes && mv ../procesado ../informes .
          git add -A
          if git rev-parse -q --verify HEAD >/dev/null && git diff --cached --quiet; then echo "Sin cambios en los datos"; exit 0; fi
          git checkout -q --orphan publicar
          git commit -q -m "Base CAFCI-CNV: datos al $(python3 -c "import json;print(json.load(open('procesado/index.json'))['mensual'][-1]['hasta'])") (corrida ${{ github.run_id }})"
          git push -q -f origin publicar:datos
          echo "Publicado en la rama datos: $(git rev-parse --short HEAD)"
